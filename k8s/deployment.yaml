# Optional: rolling-update demo on a local kind cluster (see README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
spec:
  replicas: 4
  selector:
    matchLabels: { app: cicd-demo }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: cicd-demo }
    spec:
      containers:
        - name: app
          image: cicd-demo:v1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo
spec:
  selector: { app: cicd-demo }
  ports: [{ port: 80, targetPort: 3000 }]
